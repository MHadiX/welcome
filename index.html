<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xsec Solutions // Tech & Security</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --surface-color: #121216;
            --border-color: #2a2a35;
            --accent-red: #ff2a2a;
            --accent-glow: rgba(255, 42, 42, 0.25);
            --text-main: #f0f0f3;
            --text-muted: #8b8b9f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace, system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            overflow-x: hidden;
            /* Subtle grid background effect */
            background-image: linear-gradient(rgba(255, 42, 42, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 42, 42, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        .logo {
            font-weight: bold;
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        .logo span {
            color: var(--accent-red);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: var(--surface-color);
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-red);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-red);
            animation: pulse 2s infinite;
        }

        main {
            max-width: 800px;
            width: 100%;
            margin: auto;
            text-align: center;
            padding: 4rem 0;
        }

        .terminal-window {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
            text-align: left;
            overflow: hidden;
        }

        .terminal-header {
            background-color: #1a1a22;
            padding: 10px 15px;
            display: flex;
            gap: 6px;
            border-bottom: 1px solid var(--border-color);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--border-color);
        }
        .dot.red { background-color: #ff5f56; }
        .dot.yellow { background-color: #ffbd2e; }
        .dot.green { background-color: #27c93f; }

        .terminal-body {
            padding: 2.5rem;
        }

        h1 {
            font-size: clamp(2rem, 4vw, 3.5rem);
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 1rem;
        }

        h1 span {
            color: var(--accent-red);
            text-shadow: 0 0 12px var(--accent-glow);
        }

        p {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--accent-red);
            padding: 12px 24px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.9rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            border-radius: 4px;
        }

        .btn:hover {
            background-color: var(--accent-red);
            color: #fff;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn-secondary {
            border-color: var(--border-color);
            color: var(--text-muted);
        }

        .btn-secondary:hover {
            border-color: var(--text-main);
            color: var(--text-main);
            background: transparent;
            box-shadow: none;
        }

        footer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 12px var(--accent-red); }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SYS // <span>XSEC-SOLUTIONS</span></div>
        <div class="status-badge">
            <div class="pulse-dot"></div>
            SYSTEM ONLINE
        </div>
    </header>

    <main>
        <div class="terminal-window">
            <div class="terminal-header">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
            </div>
            <div class="terminal-body">
                <h1>Xsec <span>Solutions</span></h1>
                <p>Advanced security architecture, vulnerability assessment, and digital resilience solutions engineered for the modern infrastructure.</p>
                
                <div class="btn-group">
                    <a href="#initialize" class="btn">INITIALIZE PROTOCOL</a>
                    <a href="#docs" class="btn btn-secondary">VIEW DOCS</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 Xsec Solutions. All rights reserved.
    </footer>

</body>
</html>
